<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Деньги Top Glass</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --card:#ffffff; --card2:#f9f8f5; --line:#e7e4dc; --ink:#1b1d1a; --mute:#6f716b; --faint:#a3a49e;
  --acc:#1f6b4f; --acc-soft:#e3f0ea; --ok:#1f8a5b; --ok-soft:#e2f3ea; --bad:#c2412d; --bad-soft:#fbe7e2; --warn:#a96a00; --warn-soft:#fbf0d9;
  --c1:#1f6b4f; --c2:#5b8def; --c3:#d9a441;
  --shadow:0 1px 2px rgba(20,20,10,.04),0 4px 16px rgba(20,20,10,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121412; --card:#1b1e1b; --card2:#202420; --line:#2c312c; --ink:#ecede8; --mute:#9a9d95; --faint:#6b6f68;
  --acc:#5cc497; --acc-soft:#1d3329; --ok:#5cc497; --ok-soft:#1b3328; --bad:#ff8a73; --bad-soft:#3a2420; --warn:#e8b45a; --warn-soft:#352c1a;
  --c1:#5cc497; --c2:#7fa6ff; --c3:#e8b45a; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121412; --card:#1b1e1b; --card2:#202420; --line:#2c312c; --ink:#ecede8; --mute:#9a9d95; --faint:#6b6f68;
  --acc:#5cc497; --acc-soft:#1d3329; --ok:#5cc497; --ok-soft:#1b3328; --bad:#ff8a73; --bad-soft:#3a2420; --warn:#e8b45a; --warn-soft:#352c1a;
  --c1:#5cc497; --c2:#7fa6ff; --c3:#e8b45a; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num,.v{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute);letter-spacing:0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--mute);font-weight:500}
.seg button.on{background:var(--acc-soft);color:var(--acc)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav .d{font-weight:600;font-size:16px;text-align:center}
.daynav .d small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}
.icon:disabled{opacity:.35;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px}
.hero{padding:20px 20px 18px}
.hero .lbl{color:var(--mute);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.1}
.hero .big span{font-size:22px;color:var(--mute);font-weight:500;margin-left:4px}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:16px 0 10px;gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
details.card>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.card>summary::-webkit-details-marker{display:none}
.s-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px;background:var(--card2);border:1px solid var(--line)}
.s-main{flex:1;min-width:0}
.s-t{font-size:13px;color:var(--mute);font-weight:500}
.s-v{font-size:21px;font-weight:650;letter-spacing:-.01em}
.chev{color:var(--faint);transition:transform .2s;font-size:14px}
details[open] .chev{transform:rotate(90deg)}
.body{padding:0 18px 16px;border-top:1px solid var(--line);animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.n{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.rows{margin-top:6px}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.r:last-child{border-bottom:0}
.r .k{color:var(--mute)} .r .v{font-weight:550}
.r.tot{border-bottom:0;border-top:1px solid var(--line);margin-top:4px;padding-top:11px}
.r.tot .k{color:var(--ink);font-weight:600}
.sub{font-size:12px;color:var(--faint)}
.h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin:16px 0 4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:12px;color:var(--faint);font-weight:500;text-align:right;padding:6px 0 6px 8px}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:8px 0 8px 8px;text-align:right;border-top:1px solid var(--line)}
td:first-child{font-weight:550}
.acc{padding:12px 0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc-h b{font-weight:600}
.acc-h .v{font-weight:650;font-size:18px}
.chip.sm{font-size:11.5px;padding:2px 7px}
.acc-d{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 16px;margin-top:6px;font-size:13px;color:var(--mute)}
.acc-d span:nth-child(even){text-align:right;color:var(--ink)}
.note{font-size:13px;color:var(--mute);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.note.w{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.formula{font-size:12.5px;color:var(--faint);margin-top:8px}
.hist .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.hist .row:first-child{border-top:0}
.hist .row:hover{background:var(--card2)}
.hist .dt{width:64px;flex:none;font-weight:600}
.hist .dt small{display:block;color:var(--faint);font-weight:400;font-size:12px}
.hist .mid{flex:1;min-width:0}
.hist .mid .v{font-weight:600}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:20px;z-index:5;border:0;background:var(--acc);color:var(--bg);font-weight:600;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:15px}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;font-weight:550}
.btn.pri{background:var(--acc);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13.5px}
.empty{text-align:center;padding:40px 20px}
.empty h2{margin:8px 0 6px;font-size:20px}
.empty p{color:var(--mute);margin:0 0 18px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;display:none}
.sheet.on{display:block}
.sheet .top{position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.sheet .top .wrap{padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet h3{margin:0;font-size:17px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;margin-bottom:10px}
.grp h5{margin:0 0 2px;font-size:15px}
.grp .hint{font-size:12.5px;color:var(--mute);margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:500}
.f input{width:100%;font:inherit;font-variant-numeric:tabular-nums;padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:15px;min-width:0}
.f input:focus{outline:2px solid var(--acc);outline-offset:-1px;background:var(--card)}
.f input::placeholder{color:var(--faint);font-size:13px}
.accrow{padding:10px 0;border-top:1px solid var(--line)}
.accrow:first-of-type{border-top:0;padding-top:2px}
.accrow b{display:block;font-size:14px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.muted{color:var(--mute)}
@media (max-width:420px){.hero .big{font-size:34px}.g3{gap:8px}.f input{padding:9px}}
.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center}
</style>

<div class="wrap" id="root">
  <header>
    <div class="brand">Деньги<small>Top Glass · Актобе</small></div>
    <div class="seg" id="tabs"><button data-t="day" class="on">День</button><button data-t="rep">Отчёт</button><button data-t="hist">История</button></div>
  </header>
  <div id="view"><div class="empty"><p class="muted">Загрузка…</p></div></div>
</div>
<button class="fab" id="fab" hidden>+ Внести день</button>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="gate" class="hidden"><div class="card" style="width:min(360px,90vw);padding:28px;text-align:center"><div class="brand">Деньги</div><p class="muted" style="font-size:14px">Введите пароль — устройство запомнит его.</p><div class="f"><input type="password" id="gate-pw" placeholder="Пароль" onkeydown="if(event.key==='Enter')gateLogin()"></div><div id="gate-err" style="color:var(--bad);font-size:13px;min-height:18px;margin:6px 0"></div><button class="btn pri" style="width:100%" onclick="gateLogin()">Войти</button></div></div>
<div class="wrap" style="padding-top:0;padding-bottom:0;margin-top:-80px"><div id="cl" class="sub" style="text-align:center;padding-bottom:90px"></div></div>





<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const STORES=[["zg","ЖГ"],["ks","КС"],["ac","АЦ"],["shr","ШР"],["hbk","ХБК"],["vokz","ВОКЗ"],["hrom","ХРОМ"],["oral","ОРАЛ"],["ast","АСТ"]];
const SN=Object.fromEntries(STORES);
const ACC=[
  {k:"din",n:"Динара пей",src:["ks","hrom"]},
  {k:"ayz",n:"Айзада пей",src:["ac","vokz","ast"]},
  {k:"ayt",n:"Айтолкын пей",src:["shr"]},
  {k:"apa",n:"Апа халык",src:[],hal:true},
  {k:"pet",n:"Дядь Петя",src:["zg","hbk","oral"]},
];
const COMM=0.85; // комиссия банка на безнал, %
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD=["вс","пн","вт","ср","чт","пт","сб"];

let db={}, canWrite=true, docs={}, rows=[], sel=-1, tab="day", openSet=new Set(), loaded=false;

const has=v=>typeof v==="number"&&isFinite(v);
const n=v=>has(v)?v:0;
const sum=a=>a.reduce((s,x)=>s+n(x),0);
const fmt=v=>Math.round(v).toLocaleString("ru-RU").replace(/-/,"−");
const sgn=v=>(v>0?"+":"")+fmt(v);
function dParts(id){const [y,m,d]=id.split("-").map(Number);const dt=new Date(y,m-1,d);return {d,m:MON[m-1],wd:WD[dt.getDay()],short:String(d).padStart(2,"0")+"."+String(m).padStart(2,"0")}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}

function chipCheck(v,okText){
  if(v===null) return '<span class="chip n">нет выручки</span>';
  if(Math.abs(v)<1) return `<span class="chip ok">✓ ${okText||"сходится"}</span>`;
  return v<0?`<span class="chip bad">${fmt(v)}</span>`:`<span class="chip warn">+${fmt(v)}</span>`;
}

/* ---------- расчёт ---------- */
function compute(){
  const st=docs.start||{};
  let pc={}; STORES.forEach(([k])=>pc[k]=n(st.cash?.[k]));
  let pa={}; ACC.forEach(a=>pa[a.k]=n(st.acc?.[a.k]));
  let pDiv=n(st.divEnd);
  const ids=Object.keys(docs).filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort();
  const out=[];
  const startTotal=sum(Object.values(pc))+sum(Object.values(pa))+pDiv;
  let prevTotal=has(st.divEnd)||st.cash||st.acc?startTotal:null;
  for(const id of ids){
    const d=docs[id];
    const cs={},ac={},bn={},e={},p={};
    STORES.forEach(([k])=>{cs[k]=has(d.cash?.[k])?d.cash[k]:pc[k]; bn[k]=n(d.bn?.[k]);});
    ACC.forEach(a=>{ac[a.k]=has(d.acc?.[a.k])?d.acc[a.k]:pa[a.k]; e[a.k]=n(d.exp?.[a.k]); p[a.k]=n(d.pay?.[a.k]);});
    const cashT=sum(Object.values(cs)), pCashT=sum(Object.values(pc));
    const accT=sum(Object.values(ac)), pAccT=sum(Object.values(pa));
    const hal=n(d.hal), bnS=sum(Object.values(bn)), bnT=bnS+hal;
    const expLeg=n(d.expLegacy), payLeg=n(d.payLegacy);
    const expT=sum(Object.values(e))+expLeg, payT=sum(Object.values(p))+payLeg;
    const kass=n(d.kass), disc=n(d.disc);
    const revNal=cashT-pCashT+kass;
    const check=has(d.rev)?revNal+bnT+disc-d.rev:null;
    const per=ACC.map(a=>{
      const exp=a.hal?hal:sum(a.src.map(s=>bn[s]));
      const comm=Math.round(exp*COMM/100);
      return {...a,bal:ac[a.k],prev:pa[a.k],d:ac[a.k]-pa[a.k],exp,e:e[a.k],p:p[a.k],comm,chk:ac[a.k]-pa[a.k]+e[a.k]+p[a.k]-exp+comm};
    });
    const commT=sum(per.map(q=>q.comm));
    const accVsBn=accT-pAccT+expT+payT-bnT+commT;
    const divStart=pDiv, divEnd=has(d.divEnd)?d.divEnd:divStart+kass+payT, divSpent=divStart+kass+payT-divEnd;
    const total=cashT+divEnd+accT;
    out.push({id,d,cs,pc:{...pc},cashT,pCashT,accT,pAccT,bn,hal,bnT,expT,payT,expLeg,payLeg,kass,disc,rev:has(d.rev)?d.rev:null,revNal,check,accVsBn,commT,per,divStart,divEnd,divSpent,total,prevTotal});
    pc=cs; pa=ac; pDiv=divEnd; prevTotal=total;
  }
  return out;
}

/* ---------- отрисовка ---------- */
function render(){
  rows=compute();
  if(sel<0||sel>=rows.length) sel=rows.length-1;
  document.getElementById("fab").hidden=!canWrite||!db;
  const v=document.getElementById("view");
  
  if(!loaded){return}
  if(tab==="hist") return renderHist(v);
  if(tab==="rep") return renderRep(v);
  if(!rows.length){
    v.innerHTML=`<div class="card empty"><div style="font-size:34px">₸</div><h2>Пока нет ни одного дня</h2><p>Сначала внесите остатки на начало месяца, затем первый день.</p>
    ${canWrite?`<button class="btn" onclick="openStart()">Начало месяца</button> <button class="btn pri" onclick="openForm()">Внести день</button>`:""}</div>`;
    return;
  }
  renderDay(v,rows[sel]);
}

function sec(id,ic,title,val,right,body){
  return `<details class="card" data-id="${id}" ${openSet.has(id)?"open":""}><summary><div class="s-ic">${ic}</div><div class="s-main"><div class="s-t">${title}</div><div class="s-v num">${val}</div></div>${right||""}<span class="chev">›</span></summary><div class="body">${body}</div></details>`;
}
const R=(k,v,cls="")=>`<div class="r ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`;

function renderDay(v,x){
  const P=dParts(x.id);
  const dlt=x.prevTotal===null?"":`<span class="delta ${x.total-x.prevTotal>=0?"up":"down"}">${x.total-x.prevTotal>=0?"▲":"▼"} ${sgn(x.total-x.prevTotal)} ₸ за день</span>`;
  const tot=Math.max(1,x.cashT+Math.max(0,x.divEnd)+x.accT);
  const w=a=>(Math.max(0,a)/tot*100).toFixed(2)+"%";

  // выручка
  const storeTbl=`<table><tr><th>Магазин</th><th>В кассе</th><th>Нал за день</th><th>Б/н</th></tr>${STORES.map(([k,nm])=>`<tr><td>${nm}</td><td>${fmt(x.cs[k])}</td><td>${sgn(x.cs[k]-x.pc[k])}</td><td>${fmt(x.bn[k])}</td></tr>`).join("")}<tr><td>Халык (Апа)</td><td></td><td></td><td>${fmt(x.hal)}</td></tr></table>`;
  const revBody=`<div class="rows">
    ${R("Наличка за день",fmt(x.revNal))}
    ${R("Безнал (терминалы + Халык)",fmt(x.bnT))}
    ${R("Скидки",fmt(x.disc))}
    ${R("Итого по факту",fmt(x.revNal+x.bnT+x.disc),"tot")}
    ${R("По программе",x.rev===null?"—":fmt(x.rev))}
    ${R("Разница",x.check===null?"—":chipCheck(x.check))}
  </div>
  <div class="formula">Наличка за день = касса сегодня − касса вчера (${fmt(x.cashT)} − ${fmt(x.pCashT)})${x.kass?` + дивиденды с касс ${fmt(x.kass)}`:""}</div>
  <div class="h4">По магазинам</div>${storeTbl}`;

  // наличка
  const cashBody=`<table><tr><th>Магазин</th><th>Сейчас</th><th>Вчера</th><th>±</th></tr>${STORES.map(([k,nm])=>`<tr><td>${nm}</td><td>${fmt(x.cs[k])}</td><td class="muted">${fmt(x.pc[k])}</td><td>${sgn(x.cs[k]-x.pc[k])}</td></tr>`).join("")}</table>
  ${x.kass?`<div class="note">Из касс взяли дивиденды: <b class="num">${fmt(x.kass)}</b> ₸</div>`:""}`;

  // счета
  const legacy=x.expLeg||x.payLeg;
  const accBody=`${x.per.map(a=>`<div class="acc"><div class="acc-h"><b>${a.n}</b><span class="v num">${fmt(a.bal)}</span></div>
    <div class="acc-d"><span>Безнал <span class="sub">${a.hal?"Халык":a.src.map(s=>SN[s]).join("+")}</span></span><span class="num">${fmt(a.exp)}</span>
    <span>Комиссия ${String(COMM).replace('.',',')}%</span><span class="num">−${fmt(a.comm)}</span>
    <span style="color:var(--ink)">Должно прийти</span><span class="num" style="font-weight:600">${fmt(a.exp-a.comm)}</span>
    <span>Пришло на счёт</span><span class="num">${sgn(a.d)}</span>

/* ---------- отчёт по декадам ---------- */
function flow(x){
  const R=x.rev!==null?x.rev:x.revNal+x.bnT+x.disc;
  const start=x.prevTotal===null?x.total:x.prevTotal;
  const spent=start+R-x.total;
  const unexp=spent-x.expT-x.divSpent-x.disc-x.commT;
  return {start,R,end:x.total,spent,acc:x.expT,div:x.divSpent,disc:x.disc,comm:x.commT,unexp};
}
function unexpChip(u){
  if(Math.abs(u)<1) return '<span class="chip ok">✓ всё объяснено</span>';
  return u>0?`<span class="chip bad">${fmt(u)} не объяснено</span>`:`<span class="chip warn">+${fmt(-u)} лишние</span>`;
}
function renderRep(v){

    let g=groups.find(g=>g.key===key); if(!g){g={key,y,m,dec,items:[]};groups.push(g)} g.items.push({x,i,f:flow(x)});});
  const lbl=["01–10","11–20","21–31"];
  let html='<div class="note" style="margin:0 0 10px">Расходы = начало + выручка − конец. Объяснённые: расходы со счетов, траты из дивидендов, скидки и комиссия банка. Остальное — «не объяснено».</div>';
  let curM="";
  groups.slice().reverse().forEach(g=>{
    const mm=MON[g.m-1].replace(/я$/,"ь").replace(/та$/,"т").replace(/ая$/,"ай");
    const mName={1:"Январь",2:"Февраль",3:"Март",4:"Апрель",5:"Май",6:"Июнь",7:"Июль",8:"Август",9:"Сентябрь",10:"Октябрь",11:"Ноябрь",12:"Декабрь"}[g.m];
    if(curM!==g.y+"-"+g.m){curM=g.y+"-"+g.m;html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px"><div class="h4" style="margin:0">${mName} ${g.y}</div><button class="btn sm" onclick="dlRange('${g.y}-${String(g.m).padStart(2,"0")}',0,0,'${mName} ${g.y}')">⬇ Скачать месяц</button></div>`}
    const it=g.items, s=k=>it.reduce((a,b)=>a+b.f[k],0);
    const P={start:it[0].f.start,end:it[it.length-1].f.end,R:s("R"),spent:s("spent"),acc:s("acc"),div:s("div"),disc:s("disc"),comm:s("comm"),unexp:s("unexp")};
    const id="rep-"+g.key;
    const days=it.slice().reverse().map(({x,i,f})=>{const D=dParts(x.id);return `<button class="row" data-i="${i}"><div class="dt">${D.short}<small>${D.wd}</small></div><div class="mid"><div class="v num">${fmt(f.start)} → ${fmt(f.end)}</div><div class="sub num">выручка +${fmt(f.R)} · расходы −${fmt(f.spent)}</div></div>${Math.abs(f.unexp)<1?'<span class="chip ok">✓</span>':f.unexp>0?`<span class="chip bad">${fmt(f.unexp)}</span>`:`<span class="chip warn">+${fmt(-f.unexp)}</span>`}</button>`}).join("");
    const body=`<div class="rows">${R("Деньги на начало",fmt(P.start))}${R("+ Выручка",fmt(P.R))}${R("− Расходы всего",fmt(P.spent))}
      <div style="padding:2px 0 6px 14px;border-left:2px solid var(--line);margin:2px 0 4px">${R("со счетов",fmt(P.acc))}${R("из дивидендов",fmt(P.div))}${R("скидки",fmt(P.disc))}${R("комиссия банка",fmt(P.comm))}${R("не объяснено",unexpChip(P.unexp))}</div>
      ${R("Деньги на конец",fmt(P.end),"tot")}</div>
      <button class="btn sm" style="margin-top:10px" onclick="dlRange('${g.y}-${String(g.m).padStart(2,"0")}',${[1,11,21][g.dec]},${[10,20,31][g.dec]},'${lbl[g.dec]} ${MON[g.m-1]} ${g.y}')">⬇ Скачать ${lbl[g.dec]}</button>
      <div class="h4">По дням</div><div class="hist" style="margin:0 -18px -16px">${days}</div>`;

  });
  v.innerHTML=html;
  v.querySelectorAll("details").forEach(dt=>dt.addEventListener("toggle",()=>{dt.open?openSet.add(dt.dataset.id):openSet.delete(dt.dataset.id)}));

const XL_HEAD=["Дата","Деньги на начало","Выручка","Расходы всего","со счетов","из дивидендов","скидки","комиссия банка","не объяснено","Деньги на конец"];
const dFull=id=>id.slice(8)+"."+id.slice(5,7)+"."+id.slice(0,4);
function dlRange(prefix,lo,hi,label){
  const it=rows.filter(r=>r.id.startsWith(prefix)&&(!lo||(+r.id.slice(8)>=lo&&+r.id.slice(8)<=hi)));
  if(!it.length){toast("Нет дней за этот период");return}
  const fl=it.map(flow), s=k=>fl.reduce((a,b)=>a+b[k],0);
  const main=[["Отчёт: "+label],[],XL_HEAD,...it.map((x,i)=>{const f=fl[i];return [dFull(x.id),f.start,f.R,f.spent,f.acc,f.div,f.disc,f.comm,f.unexp,f.end]}),
    ["ИТОГО",fl[0].start,s("R"),s("spent"),s("acc"),s("div"),s("disc"),s("comm"),s("unexp"),fl[fl.length-1].end],[],
    ["Не объяснено: плюс — денег меньше, чем должно быть; минус — больше."]];
  const det=[["Дата","Выручка (программа)","Нал за день","Безнал","Скидки","Сходится?","Наличка в кассах","Счета всего","Счета vs б/н","Дивиденды на конец","Всего денег"],

  saveXlsx(`Деньги ${label}.xlsx`,[["Отчёт",main,[12,16,14,14,12,14,10,14,14,16]],["По дням",det,[12,18,14,12,10,12,16,14,13,17,14]]]);
}

    ["Выручка по программе",x.rev],["Нал за день",x.revNal],["Безнал",x.bnT],["Скидки",x.disc],["Сходится?",x.check],["Счета vs б/н",x.accVsBn],[],
    ["Дивиденды: начало",x.divStart],["+ с касс",x.kass],["+ с пей",x.payT],["− потратили",x.divSpent],["конец",x.divEnd]];
  const acc=[["Счёт","Остаток","Безнал","Комиссия","Должно прийти","Пришло","Расход со счёта","Дивиденд (с пей)","Разница"],
    ...x.per.map(a=>[a.n,a.bal,a.exp,a.comm,a.exp-a.comm,a.d,a.e,a.p,a.chk])];
  const st=[["Магазин","В кассе","Нал за день","Безнал"],...STORES.map(([k,nm])=>[nm,x.cs[k],x.cs[k]-x.pc[k],x.bn[k]]),["Халык (Апа)","","",x.hal]];
  saveXlsx(`Деньги ${dFull(id)}.xlsx`,[["День",sum1,[24,14]],["Счета",acc,[14,12,12,10,14,12,15,16,10]],["Магазины",st,[14,12,13,12]]]);

async function saveXlsx(name,sheets){
  if(typeof XLSX==="undefined"){toast("Не загрузилась библиотека Excel — обновите страницу");return}
  const wb=XLSX.utils.book_new();
  for(const [nm,aoa,cols] of sheets){
    const ws=XLSX.utils.aoa_to_sheet(aoa.map(r=>r.map(v=>v===null||v===undefined?"":v)));
    ws["!cols"]=cols.map(w=>({wch:w}));
    for(const k in ws){if(k[0]!=="!"&&ws[k].t==="n")ws[k].z="#,##0"}
    XLSX.utils.book_append_sheet(wb,ws,nm);
  }
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const cl=window.claude;
  if(cl&&cl.use){const dl=await cl.use("downloads");
    if(dl){try{await dl.save({filename:name,data:buf})}catch(e){if(e&&e.code!=="declined")toast("Не удалось скачать")}return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

const sheet=document.getElementById("sheet");
const fld=(name,label,val,ph="")=>`<div class="f"><label>${label}</label><input inputmode="numeric" autocomplete="off" name="${name}" value="${has(val)?fmt(val).replace("−","-"):""}" placeholder="${ph}"></div>`;
function parseNum(s){s=String(s).replace(/[\s  ]/g,"").replace("−","-").replace(",",".");if(s==="")return undefined;const v=Number(s);return isFinite(v)?Math.round(v):NaN}
function closeSheet(){sheet.classList.remove("on");sheet.innerHTML="";document.body.style.overflow=""}

function nextDate(){
  const ids=rows.map(r=>r.id);if(!ids.length){const t=new Date();return t.toISOString().slice(0,10)}
  const [y,m,d]=ids[ids.length-1].split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d+1));return dt.toISOString().slice(0,10);
}

  const legacy=n(d.expLegacy)||n(d.payLegacy);
  sheet.innerHTML=`<div class="top"><div class="wrap"><button class="btn sm" id="cancel">Отмена</button><h3>${isNew?"Новый день":"Изменить день"}</h3><button class="btn sm pri" id="save">Сохранить</button></div></div>
  <div class="wrap" style="padding-bottom:40px"><form id="frm" onsubmit="return false">
   <div class="grp"><h5>Выручка</h5><div class="hint">Из программы и от продавцов</div>
     <div class="g2"><div class="f"><label>Дата</label><input type="date" name="date" value="${date}"></div>${fld("rev","Выручка за день",d.rev)}${fld("disc","Скидки",d.disc)}</div></div>
   <div class="grp"><h5>Наличка в кассах</h5><div class="hint">Пересчёт: сколько сейчас лежит в каждой кассе</div>

     ${ACC.map(a=>`<div class="accrow"><b>${a.n}</b><div class="g3">${fld("acc."+a.k,"Остаток",d.acc?.[a.k],prevAcc(a.k))}${fld("exp."+a.k,"Расход",d.exp?.[a.k])}${fld("pay."+a.k,"Дивиденд",d.pay?.[a.k])}</div></div>`).join("")}</div>
   <div class="grp"><h5>Дивиденды</h5><div class="hint">«С пей» берётся из счетов выше</div>

  </form></div>`;
  sheet.classList.add("on");document.body.style.overflow="hidden";sheet.scrollTop=0;

  if(del) del.onclick=async()=>{

    try{await db.doc("days/"+id).delete();closeSheet();sel=-1;toast("День удалён")}catch(e){toast("Не удалось удалить")}

function readForm(){
  const o={},bad=[];
  document.querySelectorAll("#frm input").forEach(inp=>{
    if(inp.name==="date"){o.date=inp.value;return}
    const v=parseNum(inp.value); if(v===undefined)return; if(isNaN(v)){bad.push(inp);return}
    const [a,b]=inp.name.split("."); if(b){(o[a]=o[a]||{})[b]=v}else o[a]=v;
  });
  bad.forEach(i=>i.style.outline="2px solid var(--bad)");
  return bad.length?null:o;
}

async function saveDay(oldId,old){
  const o=readForm(); if(!o){toast("Проверьте выделенные поля");return}
  const id=o.date; delete o.date;
  if(!/^\d{4}-\d\d-\d\d$/.test(id)){toast("Укажите дату");return}
  if(id!==oldId&&docs[id]){toast("Этот день уже есть — откройте его через историю");return}
  // старые общие суммы: оставляем, пока не разбиты
  if(old.expLegacy&&!o.exp) o.expLegacy=old.expLegacy;
  if(old.payLegacy&&!o.pay) o.payLegacy=old.payLegacy;
  const btn=document.getElementById("save");btn.disabled=true;btn.textContent="Сохраняю…";
  try{
    await db.doc("days/"+id).set(o);

function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(docs))}catch(e){}}

  saveLocal();

  const json=JSON.stringify(docs);lastJson=json;

}
